<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D4A" />
      <stop offset="50%" stop-color="#18476A" />
      <stop offset="100%" stop-color="#0D273D" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" />
      <stop offset="50%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#70E000" />
    </linearGradient>

    <!-- Bar Chart Gradient -->
    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="1" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />

  <!-- Outer Glow Ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#cyan-grad)" stroke-width="3" stroke-opacity="0.3" />

  <g filter="url(#shadow)" transform="translate(0, 0)">
    <!-- Bar Chart Columns -->
    <rect x="110" y="240" width="42" height="130" rx="12" fill="url(#bar-grad)" opacity="0.6" />
    <rect x="175" y="180" width="42" height="190" rx="12" fill="url(#bar-grad)" opacity="0.8" />
    <rect x="240" y="130" width="42" height="240" rx="12" fill="url(#bar-grad)" opacity="0.95" />
    <rect x="305" y="90"  width="42" height="280" rx="12" fill="url(#bar-grad)" />

    <!-- Stylized "SG" Monogram Path -->
    <!-- Letter S -->
    <path d="M 120 205 C 120 165, 210 155, 210 205 C 210 250, 120 245, 120 295 C 120 345, 215 345, 215 305" 
          fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter G -->
    <path d="M 390 205 C 390 150, 285 150, 285 245 C 285 340, 390 340, 390 270 L 330 270" 
          fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upward Trend Line & Arrowhead -->
    <path d="M 100 320 L 195 240 L 270 290 L 400 135" 
          fill="none" stroke="url(#cyan-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrow Tip -->
    <path d="M 355 135 L 408 128 L 400 180 Z" fill="url(#cyan-grad)" />
    
    <!-- Pulse Dots -->
    <circle cx="195" cy="240" r="10" fill="#FFFFFF" />
    <circle cx="270" cy="290" r="10" fill="#FFFFFF" />
    <circle cx="400" cy="135" r="12" fill="#00F5D4" />
  </g>
</svg>
